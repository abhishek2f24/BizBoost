<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="2732" height="2732" fill="url(#bg)"/>

  <!-- Icon mark (centered, 400x400) -->
  <g transform="translate(1166, 1066)">
    <rect width="400" height="400" rx="90" ry="90" fill="url(#icon-bg)"/>
    <!-- Lightning bolt inside icon -->
    <polygon points="218,70 148,218 195,218 181,330 251,182 204,182 218,70"
      fill="white" opacity="0.95"/>
  </g>

  <!-- App name below icon -->
  <text x="1366" y="1570" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
    font-size="120" font-weight="700" letter-spacing="-3"
    fill="white">BizBoost</text>

  <text x="1366" y="1670" text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
    font-size="52" font-weight="400"
    fill="rgba(165,180,252,0.8)">AI-powered growth for your business</text>
</svg>
